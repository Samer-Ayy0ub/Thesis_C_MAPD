n_tasks: 20
task_freq: 10
n_delays_per_agent: 0

map:
  dimensions: [7, 7]
  obstacles:
    # Blocco in alto a sx
    - [1, 1]
    - [2, 1]
    - [1, 2]
    - [2, 2]
    # Blocco in alto a dx
    - [4, 1]
    - [5, 1]
    - [4, 2]
    - [5, 2]
    # Blocco in basso a sx
    - [1, 4]
    - [2, 4]
    - [1, 5]
    - [2, 5]
    # Blocco in basso a dx
    - [4, 4]
    - [5, 4]
    - [4, 5]
    - [5, 5]
    
  movable_obstacles:
    - [3, 3] # Ostacolo esattamente al centro della scorciatoia
    
  non_task_endpoints:
    - [1, 3] # Sinistra
    - [5, 3] # Destra
    - [3, 1] # Alto
    - [3, 5] # Basso
    - [0, 0] # L'angolino extra!
    
  start_locations:
    - [1, 3]
    - [5, 3]
    - [3, 1]
    - [3, 5]
    - [0, 0] # L'angolino extra!
    
  goal_locations:
    - [1, 3]
    - [5, 3]
    - [3, 1]
    - [3, 5]
    - [0, 0] # L'angolino extra!

agents:
  # Agenti in posizione "idle" che attendono i task
  - name: agent0
    start: [1, 3]
    goal: [1, 3]
  - name: agent1
    start: [3, 1]
    goal: [3, 1]
  - name: agent2
    start: [5, 3]
    goal: [5, 3]

tasks:
  # 10 task sfalsati per mettere sotto stress il passaggio centrale 
  # senza far freezare l'alto livello.
  
  # Batch 1: Incrocio frontale classico
  - task_name: task0
    start: [1, 3]
    goal: [5, 3]
    start_time: 0
  - task_name: task1
    start: [3, 1]
    goal: [3, 5]
    start_time: 2

  # Batch 2: Ritorni
  - task_name: task2
    start: [5, 3]
    goal: [1, 3]
    start_time: 15
  - task_name: task3
    start: [3, 5]
    goal: [3, 1]
    start_time: 17

  # Batch 3: Curve a 90 gradi (Testano come spingono l'ostacolo lateralmente)
  - task_name: task4
    start: [1, 3]
    goal: [3, 1]
    start_time: 30
  - task_name: task5
    start: [5, 3]
    goal: [3, 5]
    start_time: 32

  # Batch 4: Rientro dalle curve
  - task_name: task6
    start: [3, 1]
    goal: [5, 3]
    start_time: 45
  - task_name: task7
    start: [3, 5]
    goal: [1, 3]
    start_time: 47

  # Batch 5: Ultimo scontro frontale
  - task_name: task8
    start: [1, 3]
    goal: [5, 3]
    start_time: 60
  - task_name: task9
    start: [3, 1]
    goal: [3, 5]
    start_time: 62

delays: {}