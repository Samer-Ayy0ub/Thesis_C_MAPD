agents:
- name: agent0
  start: [0, 0] 
- name: agent1
  start: [0, 6] 
- name: agent2
  start: [10, 3] 

map:
  dimensions: [11, 7] 
  
  obstacles:
  # Blocco statico inferiore
  - [4, 1]
  - [5, 1]
  - [6, 1]
  - [4, 2]
  - [5, 2]
  - [6, 2]
  
  # Blocco statico superiore
  - [4, 4]
  - [5, 4]
  - [6, 4]
  - [4, 5]
  - [5, 5]
  - [6, 5]

  movable_obstacles:
  # 4 Ostacoli mobili per creare congestione
  - [4, 3] # Blocca il tunnel da sx
  - [5, 3] # Kinematic chain nel tunnel
  - [5, 0] # Blocca il passaggio in basso
  - [2, 4] # Ostacolo di disturbo 
  
  non_task_endpoints:
  - [0, 0]
  - [0, 6]
  - [10, 0]
  - [10, 6]
  - [10, 3]
  - [0, 3]
  
  
  # Li lasciamo per retrocompatibilità del tuo parser
  start_locations:
  - [1, 1]
  - [1, 5]
  - [2, 3]
  - [0, 2]
  - [0, 4]
  
  goal_locations:
  - [9, 1]
  - [9, 5]
  - [8, 3]
  - [10, 2]
  - [10, 4]
  - [8, 5]

# === TASK DETERMINISTICI (USATI CON -not_rand) ===
# I task sono 12, scaglionati nel tempo per simulare un task_freq=0.5
tasks: 
  - task_name: task0
    start_time: 0
    start: [2, 3]
    goal: [8, 3]
  - task_name: task1
    start_time: 2
    start: [9, 1]
    goal: [1, 1]
  - task_name: task2
    start_time: 4
    start: [1, 5]
    goal: [9, 5]
  - task_name: task3
    start_time: 7
    start: [8, 3]
    goal: [2, 3]
  - task_name: task4
    start_time: 9
    start: [1, 1]
    goal: [9, 1]
  - task_name: task5
    start_time: 12
    start: [9, 5]
    goal: [1, 5]
  - task_name: task6
    start_time: 15
    start: [2, 3]
    goal: [8, 3]
  - task_name: task7
    start_time: 18
    start: [9, 1]
    goal: [1, 1]
  - task_name: task8
    start_time: 20
    start: [1, 5]
    goal: [9, 5]
  - task_name: task9
    start_time: 23
    start: [8, 3]
    goal: [2, 3]
  - task_name: task10
    start_time: 25
    start: [1, 1]
    goal: [9, 1]
  - task_name: task11
    start_time: 28
    start: [9, 5]
    goal: [1, 5]

# Array dei delay vuoto, nessun ritardo stocastico
delays: 
  agent0: []
  agent1: []
  agent2: []

# Questi valori vengono ignorati se si usa il flag -not_rand, 
# ma li lasciamo per sicurezza.
n_tasks: 20               
task_freq: 0.5            
n_delays_per_agent: 0